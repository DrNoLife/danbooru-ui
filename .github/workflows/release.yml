name: Release

# Push a tag like v1.2.3 to publish a release:
#   git tag -a v1.2.3 -m "Imeji 1.2.3" && git push origin v1.2.3
on:
  push:
    tags: [ "v*.*.*" ]

permissions:
  contents: read

concurrency:
  # Must differ from the CI workflow's group (names are case-insensitive), or the nested CI run would wait on this one.
  group: publish-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/dotnet.yml

  publish:
    name: Publish image
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/danbooru-ui
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: Danbooru
          file: Danbooru/Danbooru.UI/Danbooru.UI/Dockerfile
          push: true
          build-args: VERSION=${{ steps.meta.outputs.version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  github-release:
    name: GitHub release
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create release with generated notes
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          DIGEST: ${{ needs.publish.outputs.digest }}
        run: |
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Imeji ${TAG#v}" \
            --generate-notes \
            --notes "Image: \`ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/danbooru-ui:${TAG#v}\` (digest \`$DIGEST\`)"
