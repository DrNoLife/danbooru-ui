name: CI

on:
  push:
    branches: [ "main", "dev" ]
  pull_request:
    branches: [ "main", "dev" ]
  workflow_dispatch:
  # The release workflow runs this first, so a release never ships untested code.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  # Keep the job named "build": branch protection on main requires a check with that name.
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Danbooru
    steps:
      - uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: Danbooru/global.json

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('Danbooru/Directory.Packages.props', 'Danbooru/**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore

      # CI=true (set by GitHub) turns warnings into errors, see Directory.Build.props.
      - name: Build
        run: dotnet build --no-restore --configuration Release

      # The browser tests (Danbooru.UI.E2ETests) need Chromium and its system libraries.
      - name: Install Playwright Chromium
        run: pwsh Danbooru.UI.E2ETests/bin/Release/net10.0/playwright.ps1 install --with-deps chromium

      - name: Test
        run: dotnet test --no-build --configuration Release

  docker:
    name: Docker image
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      # Builds and smoke-tests the image; images are published by release.yml when a version tag is pushed.
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: Danbooru
          file: Danbooru/Danbooru.UI/Danbooru.UI/Dockerfile
          push: false
          load: true
          tags: imeji:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The page must be able to load Blazor's script, or nothing is interactive (this broke in 1.0.0/1.0.1).
      - name: Smoke test
        working-directory: .
        run: |
          docker run -d --rm -p 8080:8080 --name imeji imeji:ci
          for i in $(seq 1 30); do curl -sf http://localhost:8080/healthz && break; sleep 1; done
          script=$(curl -sf http://localhost:8080/ | grep -o '_framework/blazor\.web[^"]*\.js' | head -1)
          test -n "$script"
          curl -sf -o /dev/null "http://localhost:8080/$script"
          curl -sf -o /dev/null http://localhost:8080/js/imeji.js
          docker stop imeji
